[project]
name = "ai-content-agent"
version = "0.1.0"
description = "Automated multi-platform content & video generation agent (GPT, Claude, Google AI, Meta Muse)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "Pillow>=10.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata; sys_platform == \"win32\"",  # Windows has no IANA time zone database for SCHEDULE_TIMEZONE
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Community reverse-engineered CapCut draft writer — format is unofficial and may change.
capcut = ["pycapcut>=0.0.4,<0.1"]
# Word-level caption timing + pronunciation check from the narration audio (CAPTION_ALIGNER=whisper).
align = ["faster-whisper>=1.0"]
# Local Vietnamese TTS in-process (VOICE_PROVIDER=zerotts). VieNeu runs as its own server instead.
zerotts = ["zerotts"]

[project.scripts]
ai-content-agent = "ai_content_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_content_agent = ["web/static/*", "assets/fonts/*"]
